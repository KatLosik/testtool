openapi: 3.0.0
info:
  title: Example Mock API
  version: 1.0.0
paths:
  /greeting:
    get:
      summary: Get a greeting message
      responses:
        '200':
          description: A greeting string
          content:
            application/json:
              schema:
                type: string
  /user:
    get:
      summary: Get a user object
      responses:
        '200':
          description: A user with name and age
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  age:
                    type: integer
  /tags:
    get:
      summary: Get a list of tags
      responses:
        '200':
          description: An array of tag strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
